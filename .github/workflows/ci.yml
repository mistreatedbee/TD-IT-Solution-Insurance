name: CI

# Stack: root (React/Vite marketing), backend/ (Express API), mobile/ (Expo app).
# Updated 2026-08-12: backend + mobile test steps added (M-08 partial).
# Updated 2026-10-23: frontend Test step added (previously `npm test` was not
# run in CI at all).
# Updated 2026-10-23 (cto ruling, ADR-0014 §20): the ADR-0014 A-11 capability
# guard (src/lib/adr-0014-a11-capability-guard.test.ts) is excluded from the
# frontend Test step's default run and instead runs in its own non-blocking
# `adr-0014-a11-guard` job below. It is a Phase 1 cutover exit gate, not a
# required check on main before that cutover ships. Remove the exclusion and
# this job's continue-on-error per §20 item 5 once Phase 1 merges.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (root — React/Vite/TS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  adr-0014-a11-guard:
    name: ADR-0014 A-11 guard (pending Phase 1 — non-blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: A-11 capability guard (expected red until Phase 1 cutover ships — ADR-0014 §20)
        run: npx vitest run src/lib/adr-0014-a11-capability-guard.test.ts
        continue-on-error: true

  backend:
    name: Backend (backend/ — Node.js/TS/Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  governance:
    name: Governance gates (INC-001 CI-1 / CI-2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage 8 manifest coverage (CI-1)
        run: npm run verify:stage8-manifest

      - name: EAS build-profile feature-flag coverage (INC-002)
        run: npm run verify:eas-feature-flags

      - name: ADR prohibition guard (CI-2 partial)
        run: node scripts/check-adr-prohibitions.mjs

  mobile:
    name: Mobile (mobile/ — Expo/React Native)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # INC-004-3 (docs/organization/incidents/INC-004-mobile-feature-flags-not-inlined.md §6):
      # four layers that prove a released bundle keeps every EXPO_PUBLIC_FEATURE_* flag
      # fail-closed. Layer 1 = `expo/no-dynamic-env-var` (error in eslint-config-expo, run by
      # the Lint step above) + the grep below. Layer 4 = the discovery guard
      # `npm run verify:eas-feature-flags` in the frontend job. Wired as direct node
      # commands: mobile/package.json is deliberately not edited by this change.
      - name: INC-004 layer 1b - no dynamic process.env[...] reads in app code
        run: |
          if grep -rnE 'process\.env\[' src app app.config.ts --include='*.ts' --include='*.tsx' \
              --exclude-dir=__tests__ --exclude-dir=node_modules --exclude-dir=generated; then
            echo "::error::dynamic process.env[...] read found; Expo does not inline it (INC-004)"
            exit 1
          fi

      - name: INC-004 layer 2 - transform-and-evaluate features.ts per eas.json profile
        run: node scripts/verify-feature-flags-transform.mjs

      # OWNER EXCEPTION 2026-11-17 addendum (2026-11-19): Android background location
      # (ACCESS_BACKGROUND_LOCATION / FOREGROUND_SERVICE*) may appear in the owner-test build only.
      # Resolves app.config + plugin mods for every eas.json profile and fails on any other profile.
      - name: Background location only in owner-test (resolved Expo config per profile)
        run: |
          node scripts/verify-background-location-config.mjs --self-test
          node scripts/verify-background-location-config.mjs

      - name: INC-004 layer 3 - expo export bundle smoke test (flags inlined, no raw lookups)
        run: node scripts/verify-feature-flags-bundle.mjs
