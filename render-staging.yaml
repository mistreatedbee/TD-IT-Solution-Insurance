# Render Blueprint — Staging (MP-8)

Separate API + web services for QA/staging. Uses the **same Atlas cluster** as production
but a **different MongoDB database name** via `MONGODB_DB_NAME`. Supabase should be a
separate project or branch — set those secrets in the Render dashboard when provisioning.

Apply as a second Blueprint instance, or duplicate the production services manually with
these names and env values.

```yaml
# render-staging.yaml — not auto-wired; copy to render.yaml staging group or apply separately.
services:
  - type: web
    name: td-it-insurance-api-staging
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: td_it_insurance_staging
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_CA_CERT_PATH
        value: certs/supabase-prod-ca-2021.crt
      - key: REDIS_URL
        sync: false
      - key: SESSION_JWT_SIGNING_KEYS
        sync: false
      - key: SESSION_JWT_ACTIVE_KID
        sync: false
      - key: INTERNAL_SERVICE_KEYS
        sync: false
      - key: EMAIL_VERIFICATION_REDIRECT_URL
        value: tditinsurance://verify-email
      - key: PASSWORD_RESET_REDIRECT_URL
        value: tditinsurance://reset-password
      - key: INVITATION_ACCEPT_REDIRECT_URL
        value: tditinsurance://invitations/accept
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: td-it-insurance-web-staging
          property: host

  - type: web
    name: td-it-insurance-web-staging
    runtime: static
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: td-it-insurance-api-staging
          property: host
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
```

**Bootstrap after first deploy:**

```bash
MONGODB_URI='…' MONGODB_DB_NAME=td_it_insurance_staging npx tsx backend/scripts/bootstrap-mongo-collections.ts
```

