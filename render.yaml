# Render Blueprint — TD IT Solution Insurance
# Backend API on Render; web SPA is on Vercel (ADR-0003). See docs/DEPLOY.md.

services:
  # --- Backend API (production: td-it-solution-insurance.onrender.com) ---
  - type: web
    name: td-it-solution-insurance
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health/ready
    # Node 22+ required — @supabase/supabase-js RealtimeClient needs native WebSocket (see backend/.node-version).
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_CA_CERT_PATH
        value: certs/supabase-prod-ca-2021.crt
      - key: REDIS_URL
        sync: false
      - key: SESSION_JWT_SIGNING_KEYS
        sync: false
      - key: SESSION_JWT_ACTIVE_KID
        sync: false
      - key: INTERNAL_SERVICE_KEYS
        sync: false
      - key: EMAIL_VERIFICATION_REDIRECT_URL
        value: tditinsurance://verify-email
      # Existing-owner email on sign-up: off until cybersecurity-architect signs off (Feature 001 security review addendum).
      - key: SIGNUP_EXISTING_ACCOUNT_EMAIL_ENABLED
        value: "false"
      # Extended location-report triggers (periodic_foreground / background).
      # Declared WITHOUT a value (unset = off, fail-closed). Test-only phase;
      # only the exact string "true" enables it, and only alongside
      # LOCATION_INGESTION_ENABLED=true. Set in the Render dashboard, not here.
      - key: LOCATION_EXTENDED_TRIGGERS_ENABLED
        sync: false
      # Feature 023 Phase A BR-2: unverified customers cannot file a claim.
      # Declared WITHOUT a value (unset = off, fail-closed). Owner has not
      # confirmed the rule yet; only the exact string "true" enables it.
      # Theft reports are never gated. Set in the Render dashboard, not here.
      - key: KYC_CLAIM_GATE_ENABLED
        sync: false
      # Stage 8 KYC-2: server-side kill switch for the identity-verification
      # flow (customer submit + admin verification queue/decision/history/notes).
      # Fail-closed: unset = those routes 404. The owner-test phase needs it ON:
      # set KYC_API_ENABLED=true in the Render dashboard BEFORE deploying this.
      - key: KYC_API_ENABLED
        sync: false
      # INC-003 A-16 / ADR-0014 G-1: web signup/resend go through the backend
      # (client: 'web'). Declared WITHOUT a value: the project owner sets it to
      # this environment's web origin + /auth/callback?type=signup in the Render
      # dashboard AND adds that URL to Supabase Auth → URL configuration.
      - key: EMAIL_VERIFICATION_REDIRECT_URL_WEB
        sync: false
      - key: PASSWORD_RESET_REDIRECT_URL
        value: tditinsurance://reset-password
      # INC-003 F-2: privileged accounts (admin / security_company_operator /
      # support_agent) reset on web, not the mobile app — the deep link above
      # dead-ends them. Must be allowlisted in Supabase Auth → URL config
      # alongside PASSWORD_RESET_REDIRECT_URL.
      - key: PASSWORD_RESET_REDIRECT_URL_WEB
        value: https://td-it-solution-insurance-alpha.vercel.app/reset-password
      # Feature 017 C-1: web route, not a mobile deep link — invitations are
      # only ever issued for privileged user types, which onboard on the web
      # dashboards. Must be allowlisted in Supabase Auth → URL configuration.
      - key: INVITATION_ACCEPT_REDIRECT_URL
        value: https://td-it-solution-insurance-alpha.vercel.app/invitations/accept
      # Web is on Vercel — backend normalizes bare hostnames to https:// origins.
      - key: CORS_ALLOWED_ORIGINS
        value: https://td-it-solution-insurance-alpha.vercel.app,http://localhost:5173
