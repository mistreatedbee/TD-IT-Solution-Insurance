# Render Blueprint — TD IT Solution Insurance
# API (Node/Express) + static web (Vite/React). See docs/DEPLOY.md and ADR-0003.

services:
  # --- Backend API ---
  - type: web
    name: td-it-insurance-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_CA_CERT_PATH
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SESSION_JWT_SIGNING_KEYS
        sync: false
      - key: SESSION_JWT_ACTIVE_KID
        sync: false
      - key: INTERNAL_SERVICE_KEYS
        sync: false
      - key: EMAIL_VERIFICATION_REDIRECT_URL
        value: tditinsurance://verify-email
      - key: PASSWORD_RESET_REDIRECT_URL
        value: tditinsurance://reset-password
      - key: INVITATION_ACCEPT_REDIRECT_URL
        value: tditinsurance://invitations/accept
      # Render `host` is hostname only — backend normalizes to https:// origin.
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: td-it-insurance-web
          property: host

  # --- Marketing site + Admin + Security dashboards (SPA) ---
  - type: web
    name: td-it-insurance-web
    runtime: static
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Injected at build time — host only; src/dashboard/api/config.ts adds https://
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: td-it-insurance-api
          property: host
      # Supabase Auth (customer signup/login) — publishable anon key only; set in Render dashboard
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
