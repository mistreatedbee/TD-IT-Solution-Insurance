# Render Blueprint — TD IT Solution Insurance
# Backend API on Render; web SPA is on Vercel (ADR-0003). See docs/DEPLOY.md.

services:
  # --- Backend API (production: td-it-solution-insurance.onrender.com) ---
  - type: web
    name: td-it-solution-insurance
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_CA_CERT_PATH
        value: certs/supabase-prod-ca-2021.crt
      - key: REDIS_URL
        sync: false
      - key: SESSION_JWT_SIGNING_KEYS
        sync: false
      - key: SESSION_JWT_ACTIVE_KID
        sync: false
      - key: INTERNAL_SERVICE_KEYS
        sync: false
      - key: EMAIL_VERIFICATION_REDIRECT_URL
        value: tditinsurance://verify-email
      - key: PASSWORD_RESET_REDIRECT_URL
        value: tditinsurance://reset-password
      - key: INVITATION_ACCEPT_REDIRECT_URL
        value: tditinsurance://invitations/accept
      # Web is on Vercel — backend normalizes bare hostnames to https:// origins.
      - key: CORS_ALLOWED_ORIGINS
        value: https://td-it-solution-insurance-alpha.vercel.app,http://localhost:5173
